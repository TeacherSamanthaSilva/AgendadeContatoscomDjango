<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Agenda{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'lista_contatos' %}">Agenda</a>

        <div>
            {% if user.is_authenticated %}
                <span class="text-white me-3">Olá, {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Sair</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Entrar</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
