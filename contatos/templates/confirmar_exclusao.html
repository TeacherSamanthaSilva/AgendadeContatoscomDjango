{% extends 'base.html' %}
{% block title %}Excluir{% endblock %}

{% block content %}

<h2>Confirmar Exclusão</h2>

<p>Tem certeza que deseja excluir o contato:</p>

<strong>{{ contato.nome }} {{ contato.sobrenome }}</strong>

<form method="POST" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'lista_contatos' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
